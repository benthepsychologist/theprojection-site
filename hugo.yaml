baseURL: "https://theprojection.org"
languageCode: "en-us"
title: "The Projection"

outputs:
  home: ["HTML", "RSS"]
  section: ["HTML", "RSS"]
  page: ["HTML"]

enableRobotsTXT: true
disableKinds: ["taxonomy", "term"]

markup:
  goldmark:
    renderer:
      unsafe: false

params:
  tagline: "The surface is never the system."
  # 2026-08-09: rewritten from "Inference economics, governed infrastructure,
  # and epistemics" — that was the first thing anyone saw (browser tab,
  # search result, link preview) on nearly every page site-wide, and it's
  # jargon a first-time, non-technical visitor can't parse before even
  # loading the page. This is the sitewide fallback; /news/, /map/, and a
  # few others override it with their own tailored description already.
  description: >
    A daily-updated read on the AI buildout: who the big players are,
    where the money is going, and who is paying for the compute. Every
    story sourced and dated.
  favicon: "/favicon.png"
  mark: "/images/mark.png"

  lenses:
    ai:
      label: "AI"
      color: "#0070E0"
    global-capital:   # renamed from "money" 2026-07-30 (Ben, full rename)
      label: "Global Capital"
      color: "#A86302"
    mental-health:
      label: "Mental Health"
      color: "#E50B1E"

menus:
  # Project-level nav (Ben, 2026-08-03): the front page is the projects hub;
  # the top nav mirrors it. The three lens beats now live under /news/ (as
  # /news/ai/ etc.) and are reached from there; threads and entities are
  # shared news/map infrastructure reachable from the pages that use them.
  main:
    - name: "Research"
      url: "/research/"
      weight: 1
    - name: "News"
      url: "/news/"
      weight: 2

